spring.application.name=reusemi
server.port=8080

# Salva o banco em uma pasta local chamada 'dados-reusemi' no seu projeto
spring.datasource.url=jdbc:h2:file:./dados-reusemi;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 'update' atualiza as tabelas sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mant\u00e9m o limite alto para fotos em Base64 (produtos e foto de perfil)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

